services:
  postgres:
    image: postgres:16-alpine
    container_name: classroom_edu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: classroom_edu
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroom_edu"]
      interval: 5s
      timeout: 5s
      retries: 5

  s3:
    # S3-compatible storage cho dev (MinIO đã ngừng phát hành image công khai).
    image: chrislusf/seaweedfs:latest
    container_name: classroom_edu_s3
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:9000"
    volumes:
      - s3_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  clamav:
    # Quét virus file upload (clamd, cổng 3310). Lần đầu khởi động mất vài phút để tải chữ ký virus.
    image: clamav/clamav:stable
    container_name: classroom_edu_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  mailpit:
    image: axllent/mailpit:latest
    container_name: classroom_edu_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  clamav_data:
  postgres_data:
  s3_data:
